      {title:'Agent 声明能力，Run 启动执行',code:'@function_tool\ndef get_weather(city: str) -> str:\n    """Return illustrative weather for a city."""\n    return f"{city}: sunny, 14-20C"\n\nagent = Agent(name="weather", tools=[get_weather], model=model)\nresult = await Runner.run(agent, "东京天气怎么样？")',language:'python',label:'教学摘录 · 省略模拟模型定义与 RunConfig',paragraphs:['工具名称、描述和参数 Schema 会作为能力声明进入模型请求。函数体仍然留在应用进程里。模型看到描述，无法读取本地 Python 函数对象。'],sourceKeys:['tool-schema']},
      {title:'历史里发生了什么',paragraphs:['第二次模型输入包含用户消息、Function Call 和对应的 Function Call Output。call_id 把工具请求与结果关联起来。','实验日志中的最终回答是预设的 scripted final answer。它验证 SDK 如何组织调用与结果，不验证模型是否真的根据天气推理。'],sourceKeys:['history'],evidence:'weather_loop_experiment.log'},
      {title:'把观察压缩成一个循环',code:'while True:\n    turn = await run_single_turn(...)\n    update_history(turn)\n    if isinstance(turn.next_step, NextStepFinalOutput):\n        return finalize(turn)\n    # 继续、交接或中断，交给 Runner 分支处理',language:'python',label:'教学伪代码 · 方法名与参数有简化'}],
    quiz:{question:'一个模型响应请求了三个本地工具，下一次模型调用返回最终答案。这里有几个逻辑模型轮次？',options:['1 个','2 个','3 个','4 个'],correctAnswer:1,explanation:'同一轮可以包含多个工具调用。Turn 与 Tool Call 数量不同。'},
    takeaway:'工具输出不是自动变成答案：SDK 先把它放回后续模型输入。',next:'现在去源码中找到，究竟是谁在推进这个循环。'},
  {id:'runner',root:'沿入口读到执行循环',origin:'笔记第二章 · run.py 标记',meaning:'从公开入口进入内部运行器，再读 while True 的骨架。',
    description:'保留你在 run.py 里搜索 # * 的讲解路径。下面的源码片段来自固定提交，行号与本地加注释后的文件分开显示。先讲普通新任务；恢复路径是另一组条件分支。',interactive:'source',
    sections:[
      {title:'四级调用关系',code:'Runner.run()                  # 业务公开入口\n    ↓\nAgentRunner.run()             # 配置、资源归属与清理\n    ↓\nAgentRunner._run_impl()       # 新任务 / 恢复、轮次、控制流\n    ↓\nrun_single_turn()             # 当前轮次的模型交互和本地处理',language:'text',paragraphs:['AgentRunner 标为实验性内部实现，不属于公开 API。业务代码使用 Runner；源码讲解可以进入 AgentRunner 观察内部机制。'],sourceKeys:['agent-run','impl','single']},
      {title:'读循环时，只抓住三件事',bullets:['执行一轮，拿到 SingleStepResult。','更新 original_input 和 generated_items；handoff 可能过滤或改写历史。','读取 next_step：完成收尾、交接、暂停，或继续。'],sourceKeys:['history','nextstep']},
      {title:'首轮为什么有两种调用位置',paragraphs:['首轮通过 asyncio 任务组织模型执行，并配合输入护栏的处理；后续轮次直接 await run_single_turn。06a 和 06b 是不同分支，不应讲成每一轮依次经过两次模型调用。','轮次计数位于新的模型调用之前。超过上限时，默认抛出 MaxTurnsExceeded；当前版本还允许配置相应错误处理器。'],sourceKeys:['first-turn','later-turn','limit']}],
    quiz:{question:'为什么不从头逐行读完 _run_impl 的所有分支？',options:['内部源码不值得读','先沿新任务主线建立调用地图，再展开恢复等分支','while True 会自动处理所有异常','只看函数名就能证明实现'],correctAnswer:1,explanation:'真实实现同时覆盖恢复、护栏、持久化和异常。先明确主线，再按问题展开，是阅读方法，不是省略这些机制的存在。'},
    takeaway:'Runner 负责控制整个 Run，Single Turn 负责推进当前一轮。',next:'继续进入 Single Turn：先找到模型，再真正发出请求。'},
  {id:'model',root:'模型调用前后发生什么',origin:'笔记第三章 · 固定源码',meaning:'Provider 找模型，Model 适配 API，响应再被分类。',
    description:'以无前缀模型名 gpt-4.1、默认 OpenAI Provider、非流式 Responses HTTP 路径为例。应用直接传入 Model 对象时，可以跳过模型名称解析。',
    sections:[
      {title:'从字符串到能调用的对象',code:'get_model(agent, run_config)\n    → MultiProvider.get_model("gpt-4.1")\n    → OpenAIProvider.get_model(...)\n    → OpenAIResponsesModel(...)',language:'text',label:'典型路径示意',paragraphs:['RunConfig.model 优先于 Agent.model。给的是 Model 实例就直接使用；给的是模型名称或默认配置，才交给 Provider 解析。','Python 运行时调用具体对象的方法。编辑器跳转到 Model 接口，并不意味着请求只执行接口定义。'],sourceKeys:['model']},
      {title:'发请求之前：准备输入和执行回调',paragraphs:['get_new_response 先处理模型输入过滤、选择模型和合并设置，再调用 on_llm_start。请求由 get_response_with_retry 包装，最终进入 model.get_response。','Retry Loop 服务于同一次逻辑请求的失败重试；Agent Loop 管理多轮模型交互，两者的计数语义不同。'],sourceKeys:['request','llm-start','retry','api']},
      {title:'返回 completed，为什么还没完成任务',table:{head:['数据结构','解决什么问题'],rows:[['Response','底层模型 API 返回的数据'],['ModelResponse','统一不同模型适配器的响应'],['ProcessedResponse','分类消息、工具、handoff 等操作'],['SingleStepResult','本轮产物与下一步控制指令']]},paragraphs:['Responses API 的 status="completed" 表示本次响应完成。它可能只返回一个 function_call，接下来还需要本地执行工具。','process_model_response 识别并组织待执行动作；普通 Python 函数在后续执行阶段调用。'],sourceKeys:['parse','actions']}],
    quiz:{question:'RunConfig.model 和 Agent.model 同时指定时，哪个优先？',options:['Agent.model','RunConfig.model','随机选择','固定使用默认模型'],correctAnswer:1,explanation:'固定版本的 get_model 先检查 RunConfig.model，再检查 Agent.model。'},
    takeaway:'模型适配器隔离 API 差异，Runner 通过统一接口使用模型。',next:'模型提出了 function_call，下一步把 JSON 变成 Python 函数调用。'},
  {id:'tools',root:'从 Function Call 到函数执行',origin:'新增 · 对应笔记第四章',meaning:'同一个函数，既要提供模型可读的声明，也要提供本地执行入口。',
    description:'笔记第四章目前只展开到 @function_tool。这里补充固定提交中的 Schema、参数准备与函数执行路径，供继续读源码；不代表这部分已经完成个人逐行学习。',interactive:'tools',
    sections:[
      {title:'声明与执行，是两个方向',table:{head:['面向谁','FunctionTool 提供什么'],rows:[['模型','name、description、params_json_schema'],['SDK 本地执行器','on_invoke_tool 等执行入口']]},paragraphs:['function_tool 利用函数签名、类型注解和文档字符串生成 Schema，并包装参数处理和调用逻辑。模型请求通过名称与调用参数被匹配到工具。'],sourceKeys:['tool-schema','parse']},
      {title:'JSON 参数怎样进函数',code:'arguments 字符串\n    → JSON 解析\n    → Pydantic 参数模型校验\n    → schema.to_call_args(parsed)\n    → args / kwargs\n    → 实际 Python 函数',language:'text',label:'简化执行路径',paragraphs:['固定版本同时处理同步和异步函数；同步函数通过 asyncio.to_thread 执行，异步函数则 await。这里省略审批、工具护栏与输出校验等分支。'],sourceKeys:['tool-args','tool-call']},
      {title:'工具失败是否一定终止 Run',paragraphs:['现有实验中，默认错误处理把工具异常转换成通用的模型可见结果，然后继续到下一次模拟模型调用。','这是特定默认配置下的观察。显式的 failure_error_function、上层错误处理器、超时和取消有各自规则，不能由一个实验推出所有错误都会被吞掉。'],evidence:'weather_loop_experiment.log'}],
    quiz:{question:'工具要求 city: str，实验却传入 {"city":123}。已有日志显示什么？',options:['函数体执行后抛错','参数处理失败，函数体未执行','SDK 自动将参数换成 Tokyo','整个操作没有产生工具结果'],correctAnswer:1,explanation:'保存日志显示 tool_invocations: []；默认错误转换生成了工具输出，随后发生第二次模拟模型调用。'},
    takeaway:'Schema 帮模型理解调用方式，也帮执行器在边界解析和校验参数。',next:'本地动作完成以后，用 NextStep 把控制权交回 Runner。'},
  {id:'control',root:'继续、交接、暂停与结束',origin:'笔记第二、六章 · 交接实验',meaning:'把下一步表达成数据，由外层运行器解释。',
    description:'下方选择的是四种控制流的教学示意，没有在浏览器运行 SDK。Handoff 机制对应新补充的第五章；现有交接日志证明其中一条具体路径发生了 Agent 切换。',interactive:'branches',
    sections:[
      {title:'四种结果对应四种动作',table:{head:['NextStep','Runner 行为'],rows:[['NextStepRunAgain','保存所需项目，进入下一轮'],['NextStepHandoff','更新 current_agent，使用目标配置继续'],['NextStepFinalOutput','输出校验与收尾后返回 RunResult'],['NextStepInterruption','返回待处理事项及可恢复状态']]},sourceKeys:['nextstep','final','interrupt','handoff-branch','again']},
      {title:'协议相同，执行语义不同',code:'Agent.handoffs = [Refund Agent]\n    → get_handoffs() 创建 Handoff\n    → _convert_handoff_tool() 转成 Function Tool 声明\n    → 模型返回 function_call\n    → process_model_response() 按名称匹配\n    → execute_handoffs() 调用 on_invoke_handoff\n    → NextStepHandoff(new_agent)\n    → Runner 更新 current_agent',language:'text',label:'第五章主线 · 简化调用链',paragraphs:['Handoff 不是 FunctionTool 的子类，也不属于 Tool 联合类型。SDK 把它转换成相同模型协议下的 Function Tool 声明；API 的 FunctionToolParam 与 SDK 的 FunctionTool 类不是同一层概念。','模型调用名称与已注册 Handoff 匹配后，SDK 组织 ToolRunHandoff，执行回调取得目标 Agent，再由 Runner 完成交接。目标对象来自已注册配置，不是模型动态创建的新 Agent。'],sourceKeys:['handoff-config','handoff-convert','handoff','handoff-branch']},
      {title:'Handoff 与 Agent.as_tool',paragraphs:['Handoff 将执行控制权交给新 Agent，后续循环使用目标 Agent 的配置。它借用模型 Function Calling 协议，但 SDK 内部走独立的交接处理路径。','Agent.as_tool 以工具形式运行子 Agent，并可把工具结果交还给主 Agent 继续。两者的关键区别是调用完成后的控制权。模型侧复用调用协议，SDK 侧保留独立执行语义；交接过滤与边界情况仍需进一步验证。'],sourceKeys:['handoff'],evidence:'agent_handoff_hooks_experiment.log'},
      {title:'状态有不同的生命周期',table:{head:['对象','保存什么'],rows:[['RunContextWrapper','本次运行的业务上下文、用量等'],['Session','跨 Run 的对话历史'],['RunState','可恢复的执行现场与审批状态']]},paragraphs:['Context 不会因为传给 Runner 就自动进入模型输入。需要显式通过工具结果、Instructions 等提供给模型。','中断后可通过 result.to_state() 获取现场，审批后将 state 传入 Runner.run。网页只展示概念；本次已有日志没有验证审批恢复和跨进程序列化。外部退款等副作用仍需业务幂等机制。']}],
    quiz:{question:'Handoff 后的下一次模型调用通常使用哪个 Agent 的配置？',options:['一直使用起始 Agent','目标 Agent','两个 Agent 随机合并','Handoff 自动结束所有调用'],correctAnswer:1,explanation:'Runner 更新 current_agent，后续使用目标 Agent 的 Instructions、Tools、Model 等配置。'},
    takeaway:'Session 是历史，RunState 是执行现场；不要把两者混成一个“记忆”。',next:'找到运行前后的公开回调，观察并扩展这个过程。'},
  {id:'hooks',root:'沿时间线找扩展点',origin:'新增 · 固定源码与 hooks 日志',meaning:'先确定想在哪个阶段介入，再选择对应的公开接口。',
    description:'老板关注的“模型调用前后与插件插入点”，在这里落到具体接口。不是所有扩展需求都该放进同一个 hook：观察、输入改写、工具行为和业务校验各有位置。',interactive:'hooks',
    sections:[
      {title:'按作用范围选择接口',table:{head:['接口','作用范围 / 用途'],rows:[['Runner.run(..., hooks=...) / RunHooks','本次 Run 的生命周期观察'],['Agent.hooks / AgentHooks','相应 Agent 的生命周期回调'],['RunConfig.call_model_input_filter','明确地改写模型调用的输入与指令'],['自定义 Model / ModelProvider','替换模型适配与解析方式'],['FunctionTool / Handoff 回调','工具能力和交接行为']]},sourceKeys:['lifecycle','input-filter']},
      {title:'模型调用前后，并非简单包住一行 HTTP',paragraphs:['非流式主路径在输入过滤后调用 on_llm_start，再进入模型调用。llm_end 在这个版本有延迟执行和恢复相关逻辑：应结合 run_single_turn 中的 after_invocation_validation 阅读。','已有日志验证的是一次正常工具调用和一次交接路径的事件顺序。不能将顺序外推到所有重试、异常、并行或恢复场景。'],sourceKeys:['llm-start','llm-end'],evidence:'agent_handoff_hooks_experiment.log'},
      {title:'先试一个观察用的 Hook',code:'class Observe(RunHooks):\n    async def on_llm_start(self, context, agent, system_prompt, input_items):\n        print("model start:", agent.name)\n\n    async def on_tool_start(self, context, agent, tool):\n        print("tool start:", tool.name)\n\n# 传给这次 Run，而不是调用内部 AgentRunner\nresult = await Runner.run(agent, input, hooks=Observe())',language:'python',label:'教学示例 · 需已有 agent、input 和 SDK 环境',paragraphs:['可以类比前端生命周期回调：在约定时机调用应用代码。类比的边界是 SDK 的阶段和状态模型不同，且回调并不等于一套通用插件隔离或权限机制。','需要拦截业务操作时，应选择真正对应的工具审批、工具护栏或应用权限边界，不能只靠日志 Hook。']}],
    quiz:{question:'想明确改写下一次模型请求的输入，应该优先研究哪个公开配置？',options:['直接调用 AgentRunner','RunConfig.call_model_input_filter','在浏览器修改文本','假定 on_llm_end 的返回值会成为新输入'],correctAnswer:1,explanation:'该配置是明确的模型输入过滤扩展点；生命周期回调与输入变换的职责不同。'},
    takeaway:'把“想扩展什么”对应到具体阶段与作用范围，再去读接口的实现。',next:'用保存的实验记录验证理解，而不把动画当成运行证据。'},
  {id:'labs',root:'先预测，再看实验',origin:'已有实验 · 2026-11-06 Cloud IDE',meaning:'让一次猜测对应到具体输入、输出和源码。',
    description:'这里展示既有 ScriptedModel 实验的保存结果。点击“查看已有记录”只读取随网站打包的日志摘录，不会现场运行 Python。笔记第八章的真实模型实验代码属于另一组实验设计。',interactive:'labs',
    sections:[
      {title:'哪些已经验证，哪些还没有',table:{head:['范围','现有证据'],rows:[['基础工具、无效参数、工具异常、max_turns','weather_loop_experiment.log'],['正常工具与交接的 hooks 顺序','agent_handoff_hooks_experiment.log'],['修改 run.py 输出 next_step','源码观察-next-step-CloudIDE运行记录.log'],['审批恢复、stop_on_first_tool、并行取消','本次材料没有对应实测记录']]},paragraphs:['这些结果对应固定源码和专用 Python 环境，不是所有模型或发行包环境的通用保证。日志记录的错误消息、调用次数和 Agent 名称可以与源码解释相互核对。']},
      {title:'继续动手的最小任务',bullets:['先预测 max_turns=2 时，第三次请求前工具已执行了几次。','打开保存的 next-step.patch，看教学输出插在何处，并对照运行日志。','在独立学习分支亲自改一个参数、运行、记录差异，再用自己的话解释原因。'],evidence:'源码观察-next-step-CloudIDE运行记录.log'}],
    quiz:{question:'网页播放完一条工具调用动画，能证明 SDK 真的执行成功吗？',options:['能，动画就是执行','不能，需要实际运行记录和对应版本','只要有绿色提示就能','只要页面没有报错就能'],correctAnswer:1,explanation:'教学模拟、源码分析和实际运行证据解决不同问题。这里把保存日志作为证据入口。'},

  {id:'design',root:'把理解带回自己的应用',origin:'笔记第九、十章 · 设计分析',meaning:'从职责与控制权出发选择抽象。',

    sections:[

      {title:'选型先问你希望控制哪一层',paragraphs:['直接使用 Responses API，可以自行组织本地工具循环。Agents SDK 已提供 Agent、Runner 与工具执行机制。笔记对 LangGraph 的比较强调显式 State、Node、Edge 的工作流表达。','这是一种组织方式的比较，不是同版本全功能对照。复杂确定性流程与模型自主决策可以组合使用；实际选型还需围绕自己的约束验证。']},

(() => {
  const {el}=UI;
  const validIds=new Set(WordRoots.map(item=>item.id));
  const storageKey='agents-runtime-workshop-v1';
  let storageAvailable=true;
  let completed=new Set();
  try {
    const stored=JSON.parse(localStorage.getItem(storageKey)||'[]');
    if(Array.isArray(stored))completed=new Set(stored.filter(id=>validIds.has(id)));
  }catch{storageAvailable=false;}
  const main=document.getElementById('content');
  const nav=document.getElementById('chapter-nav');
  const presenter=document.getElementById('presenter');
  function updateProgress() {
    document.getElementById('progress-text').textContent=`${completed.size} / ${WordRoots.length}`;
    document.getElementById('reading-progress').value=completed.size;
    document.getElementById('storage-note').textContent=storageAvailable?'进度仅保存在当前浏览器':'当前浏览器无法保存进度，本次阅读仍可继续';
  }
  function toggle(id,button) {
    if(completed.has(id))completed.delete(id);else completed.add(id);
    try{localStorage.setItem(storageKey,JSON.stringify([...completed]));}catch{storageAvailable=false;}
    button.textContent=completed.has(id)?'已读 · 再点可取消':'标记本章已读';
    button.setAttribute('aria-pressed',String(completed.has(id)));
    updateProgress();
  }
  function render() {
    const route=location.hash.slice(1)||'start';
    if(route==='content')return;
    const index=WordRoots.findIndex(item=>item.id===route);
    nav.replaceChildren(...WordRoots.map((item,i)=>el('a',{href:`#${item.id}`,'aria-current':i===index?'page':null},el('span',{className:'chapter-num'},String(i+1).padStart(2,'0')),item.root)));
    for(const link of document.querySelectorAll('.side-tools a')){
      if(link.hash===location.hash)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current');
    }
    if(index>=0){
      main.replaceChildren(Views.lesson(WordRoots[index],index,completed,toggle));
      document.getElementById('position').textContent=`章节 ${index+1} / ${WordRoots.length} · ${WordRoots[index].root}`;
      document.title=`${WordRoots[index].root} · ${siteConfig.siteName}`;
    }else if(['glossary','review','resources'].includes(route)){
      main.replaceChildren(Views[route]());
      const label={glossary:'术语索引',review:'复习卡',resources:'材料与证据'}[route];
      document.getElementById('position').textContent=label;document.title=`${label} · ${siteConfig.siteName}`;
    }else{
      main.replaceChildren(el('article',{},el('h1',{},'这个位置没有章节'),el('p',{},'可以从导航回到学习主线。'),el('a',{href:'#start'},'回到开始 →')));
      document.getElementById('position').textContent='未找到章节';
    }
    updateProgress();
    window.scrollTo({top:0,behavior:'instant'});
    main.focus({preventScroll:true});
    const active=nav.querySelector('[aria-current]');
    if(active&&window.innerWidth<761)active.scrollIntoView({block:'nearest',inline:'center'});
  }
  presenter.addEventListener('click',()=>{
    const active=document.body.classList.toggle('presenting');
    presenter.setAttribute('aria-pressed',String(active));
    presenter.textContent=active?'退出投屏':'投屏模式';
    UI.toast(active?'投屏模式已开启；Esc 可退出':'已回到阅读模式');
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'&&document.body.classList.contains('presenting'))presenter.click();
    if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
    if(event.target.closest('input,select,button,a,[contenteditable="true"],pre'))return;
    const index=WordRoots.findIndex(item=>`#${item.id}`===location.hash);
    if(event.key==='ArrowRight'&&index>=0&&index<WordRoots.length-1){event.preventDefault();location.hash=WordRoots[index+1].id;}
    if(event.key==='ArrowLeft'&&index>0){event.preventDefault();location.hash=WordRoots[index-1].id;}
  });
  document.querySelector('.skip-link').addEventListener('click',event=>{event.preventDefault();main.focus();main.scrollIntoView();});
  window.addEventListener('hashchange',render);
  render();
})();


document.addEventListener('click', event => {
  const anchor = event.target.closest('a');
  const target = anchor && anchor.getAttribute('href');
  if (target && target.startsWith('#') && target !== '#content') {
    event.preventDefault();
    location.hash = target;
  }
});
